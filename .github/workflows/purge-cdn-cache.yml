# Required GitHub Secrets:
#   CF_API_TOKEN        — Cloudflare API Token (permissions: Cache Purge + Workers KV Storage Write)
#   CF_ZONE_ID          — Zone ID for yourdomain.com (Cloudflare dashboard → Overview → Zone ID)
#   CF_ACCOUNT_ID       — Cloudflare Account ID (Cloudflare dashboard → Overview → Account ID)
#   CF_KV_NAMESPACE_ID  — Workers KV Namespace ID
#                         Setup: cd cloudflare-infra/workers/cdn && wrangler kv namespace create CDN_KV
#
# Required GitHub Variables:
#   CDN_DOMAIN          — e.g. cdn.yourdomain.com

name: Purge CDN Cache

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      force:
        description: "Force purge all cached files (for testing)"
        type: boolean
        default: false

env:
  CDN_DOMAIN: ${{ vars.CDN_DOMAIN }}

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2

      - name: Detect changed asset files
        id: diff
        run: |
          FORCE="${{ github.event.inputs.force }}"

          if [ "$FORCE" = "true" ]; then
            # Force mode: treat all tracked files as "to process"
            git ls-files \
              | grep -vE '^(\.github/|README\.md|package\.json)' \
              > changed_files.txt
            echo "Mode: force (all files)"
          else
            # Incremental mode: only Added / Copied / Modified / Renamed / Type-changed files.
            # --diff-filter excludes Deleted (D) files so we never try to purge a URL
            # that no longer exists in the repo (would cause Cloudflare API 400 → exit 22).
            git diff --name-only --diff-filter=ACMRT HEAD~1 HEAD \
              | grep -vE '^(\.github/|README\.md|package\.json)' \
              > changed_files.txt || true
            echo "Mode: incremental (changed files only)"
          fi

          COUNT=$(wc -l < changed_files.txt | tr -d ' ')
          echo "=== Files to process (${COUNT}) ==="
          cat changed_files.txt
          echo "count=${COUNT}" >> $GITHUB_OUTPUT

          # Use purge_everything when: force mode OR file count exceeds Cloudflare's 30-URL limit.
          if [ "$FORCE" = "true" ] || [ "$COUNT" -gt 30 ]; then
            echo "purge_everything=true" >> $GITHUB_OUTPUT
          else
            echo "purge_everything=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if no asset changes
        if: steps.diff.outputs.count == '0'
        run: echo "No asset files changed, skipping."

      # Write the current commit SHA (short) to Workers KV.
      # Worker uses it to build jsDelivr URL: @{sha}/path
      # New commit SHA = new jsDelivr cache key → jsDelivr always fetches fresh from GitHub.
      # jsDelivr officially supports commit SHA refs and caches them permanently (immutable).
      - name: Update Workers KV (CURRENT_SHA)
        if: steps.diff.outputs.count != '0'
        run: |
          SHA="${GITHUB_SHA:0:7}"
          echo "Writing CURRENT_SHA=${SHA} to KV..."
          curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_NAMESPACE_ID }}/values/CURRENT_SHA" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: text/plain" \
            --data "$SHA"

      # Wait for KV write to propagate to all Cloudflare edge nodes.
      # KV global propagation can take up to 60 seconds; purge & warm-up must start after this.
      - name: Wait for KV propagation
        if: steps.diff.outputs.count != '0'
        run: sleep 20

      # Purge Cloudflare cache to invalidate stale content.
      # On the next request: Cloudflare miss → Worker reads KV (new SHA) → jsDelivr@{sha} → fresh content.
      - name: Purge Cloudflare cache
        if: steps.diff.outputs.count != '0'
        run: |
          if [ "${{ steps.diff.outputs.purge_everything }}" = "true" ]; then
            echo "Purging everything on Cloudflare (force or >30 files)..."
            curl -sf -X POST \
              "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything": true}'
          else
            # Build a valid JSON array: one quoted URL per line, joined by commas.
            URLS_JSON=$(
              awk -v domain="$CDN_DOMAIN" '{printf "\"https://%s/%s\"\n", domain, $0}' changed_files.txt \
                | paste -sd',' \
                | sed 's/^/[/' \
                | sed 's/$/]/'
            )
            echo "Purging Cloudflare URLs: $URLS_JSON"
            curl -sf -X POST \
              "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data "{\"files\": $URLS_JSON}"
          fi

